name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Mobile App Dependencies
        run: |
          cd android_app
          npm install

      - name: Generate Native Android Project (Expo Prebuild)
        run: |
          cd android_app
          npx expo prebuild --platform android --no-install

      - name: Build Debug APK
        run: |
          cd android_app/android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvies-4.0-Android-APK
          path: android_app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
